name: Daily Quant Betting Card

on:
  schedule:
    # 10:30 UTC = 17:30 Thailand Time (UTC+7) every day
    - cron: '30 10 * * *'
  workflow_dispatch: # Allows manual trigger from phone / GitHub Web

jobs:
  run-daily-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Quant Betting Card
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: |
          python scripts/daily_telegram_card.py
